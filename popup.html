<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>SPU Annotation Helper</h1>

    <div class="row toggle-row">
      <label for="enabled">Custom UI</label>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row toggle-row">
      <label for="autoKeyY">Auto key-in "Y" on new product</label>
      <label class="switch">
        <input type="checkbox" id="autoKeyY" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row toggle-row">
      <label for="smartHints">Smart hints (replace native hints)</label>
      <label class="switch">
        <input type="checkbox" id="smartHints" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row kb-row">
      <label for="smartHintsMinLen">Min match length</label>
      <input type="number" id="smartHintsMinLen" min="2" max="20" step="1" />
    </div>

    <div class="row">
      <label>Website layout sizes</label>
      <button id="resetLayout" type="button" class="secondary small-btn">Reset</button>
    </div>

    <h2>Key bindings</h2>
    <p class="hint">Click "+ key" and press a key. Each action can have several keys; click a key's ✕ to remove it.</p>

    <div class="kb-group" data-key="next">
      <label>Next product</label>
      <div class="kb-keys" id="keys-next"></div>
    </div>
    <div class="kb-group" data-key="prev">
      <label>Previous product</label>
      <div class="kb-keys" id="keys-prev"></div>
    </div>
    <div class="kb-group" data-key="optionUp">
      <label>Option up</label>
      <div class="kb-keys" id="keys-optionUp"></div>
    </div>
    <div class="kb-group" data-key="optionDown">
      <label>Option down</label>
      <div class="kb-keys" id="keys-optionDown"></div>
    </div>

    <div class="actions">
      <button id="reset" class="secondary">Reset defaults</button>
      <button id="save" class="primary">Save</button>
    </div>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
